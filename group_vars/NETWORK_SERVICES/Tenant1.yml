---
# ======================================================
# Tenant1 - Network Services
# ======================================================

tenant1_services:
  - name: Tenant1
    mac_vrf_vni_base: 10000

    vrfs:

      # ==================================================
      # Tenant1 VRF1
      # ==================================================
      - name: Tenant1_VRF1
        vrf_vni: 50111

        svis:

          # User VLAN
          - id: 110
            name: USERS_T1_VR1_VLAN110
            enabled: true
            ip_address_virtual: 10.10.110.1/24


          # User VLAN
          - id: 130
            name: USERS_T1_VR1_VLAN130
            enabled: true
            ip_address_virtual: 10.10.130.1/24

          # Transit to Inter-VRF Router
          - id: 1101
            name: T1_VRF1_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 101.101.101.1/30

        static_routes:          
          - prefix: 10.20.120.0/24
            next_hop: 101.101.101.2
            nodes:
              - DC1-Leaf1

          - prefix: 20.10.210.0/24
            next_hop: 101.101.101.2
            nodes:
              - DC1-Leaf1
              
          - prefix: 20.20.220.0/24
            next_hop: 101.101.101.2
            nodes:
              - DC1-Leaf1

      # ==================================================
      # Tenant1 VRF2
      # ==================================================
      - name: Tenant1_VRF2
        vrf_vni: 50112

        svis:

          # User VLAN
          - id: 120
            name: USERS_T1_VR2_VLAN120
            enabled: true
            ip_address_virtual: 10.20.120.1/24

          # Transit to Inter-VRF Router
          - id: 1102
            name: T1_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 102.102.102.1/30

        static_routes:
          - prefix: 10.10.110.0/24
            next_hop: 102.102.102.2
            nodes:
              - DC1-Leaf1
          - prefix: 10.10.130.0/24
            next_hop: 202.202.202.2
            nodes:
              - DC1-Leaf1              
          - prefix: 20.10.210.0/24
            next_hop: 102.102.102.2
            nodes:
              - DC1-Leaf1
              
          - prefix: 20.20.220.0/24
            next_hop: 102.102.102.2
            nodes:
              - DC1-Leaf1


# ======================================================
# AVD Custom Structured Configuration Prefixes
#
# Preserves AVD default prefix.
# Adds independent prefixes for Tenant1 and Tenant2.
# ======================================================

custom_structured_configuration_prefix:
  - custom_structured_configuration_
  - tenant1_csc_
  - tenant2_csc_

