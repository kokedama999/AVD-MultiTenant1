---
# Tenant1 contains Tenant1_VRF1 and Tenant1_VRF2.
tenant1_services:
  - name: Tenant1
    mac_vrf_vni_base: 10000

    vrfs:
      - name: Tenant1_VRF1
        vrf_vni: 50111

        svis:
          - id: 110
            name: USERS_VLAN110
            enabled: true
            ip_address_virtual: 10.110.110.1/24

      - name: Tenant1_VRF2
        vrf_vni: 50112

        svis:
          - id: 120
            name: USERS_T1_VR2_VLAN120
            enabled: true
            ip_address_virtual: 10.20.120.1/24

          # Dedicated router/firewall transit VLAN for Tenant1_VRF1
          - id: 91
            name: T1_VRF1_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 10.255.91.1/30

          # Dedicated router/firewall transit VLAN for Tenant1_VRF2
          - id: 92
            name: T1_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 10.255.92.1/30
