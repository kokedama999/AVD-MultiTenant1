---
# ======================================================
# Tenant1 - Network Services
# ======================================================

tenant1_services:
  - name: Tenant1
    mac_vrf_vni_base: 10000

    vrfs:

      # ==================================================
      # Tenant1 VRF1
      # ==================================================
      - name: Tenant1_VRF1
        vrf_vni: 50111

        svis:

          # User VLAN
          - id: 110
            name: USERS_T1_VR1_VLAN110
            enabled: true
            ip_address_virtual: 10.10.110.1/24

          # Transit to Inter-VRF Router
          - id: 91
            name: T1_VRF1_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 10.255.11.1/30

        static_routes:
          - prefix: 10.20.120.0/24
            next_hop: 10.255.91.2
            nodes:
              - DC1-Leaf1

      # ==================================================
      # Tenant1 VRF2
      # ==================================================
      - name: Tenant1_VRF2
        vrf_vni: 50112

        svis:

          # User VLAN
          - id: 120
            name: USERS_T1_VR2_VLAN120
            enabled: true
            ip_address_virtual: 10.20.120.1/24

          # Transit to Inter-VRF Router
          - id: 92
            name: T1_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 10.255.12.1/30

        static_routes:
          - prefix: 10.10.110.0/24
            next_hop: 10.255.92.2
            nodes:
              - DC1-Leaf1


# ======================================================
# AVD Custom Structured Configuration Prefixes
#
# Preserves AVD default prefix.
# Adds independent prefixes for Tenant1 and Tenant2.
# ======================================================

custom_structured_configuration_prefix:
  - custom_structured_configuration_
  - tenant1_csc_
  - tenant2_csc_


# ======================================================
# Tenant1 DHCP Pools
# ======================================================

tenant1_dhcp_server_definitions:

  - vrf: Tenant1_VRF1
    lease_time_ipv4:
      days: 1
      hours: 0
      minutes: 0
    ipv4_subnets:
      - subnet: 10.10.110.0/24
        default_gateway: 10.10.110.1
        ranges:
          - start: 10.10.110.10
            end: 10.10.110.254

  - vrf: Tenant1_VRF2
    lease_time_ipv4:
      days: 1
      hours: 0
      minutes: 0
    ipv4_subnets:
      - subnet: 10.20.120.0/24
        default_gateway: 10.20.120.1
        ranges:
          - start: 10.20.120.10
            end: 10.20.120.254


# ======================================================
# Enable DHCP on Tenant1 SVIs
# ======================================================

tenant1_dhcp_svi_definitions:
  - name: Vlan110
    dhcp_server_ipv4: true

  - name: Vlan120
    dhcp_server_ipv4: true


# ======================================================
# Apply Tenant1 DHCP only to DC1-Leaf4
# ======================================================

tenant1_csc_dhcp_servers: "{{ tenant1_dhcp_server_definitions if inventory_hostname == 'DC1-Leaf4' else [] }}"

tenant1_csc_vlan_interfaces: "{{ tenant1_dhcp_svi_definitions if inventory_hostname == 'DC1-Leaf4' else [] }}"
