---
# Tenant1 contains Tenant1_VRF1 and Tenant1_VRF2.

tenant1_services:
  - name: Tenant1
    mac_vrf_vni_base: 10000

    vrfs:

      # ======================================================
      # Tenant1 VRF1
      # ======================================================
      - name: Tenant1_VRF1
        vrf_vni: 50111

        svis:

          # User VLAN
          - id: 110
            name: USERS_T1_VR1_VLAN110
            enabled: true
            ip_address_virtual: 10.10.110.1/24

            # DHCP server pool definition (custom data)
            dhcp_pool:
              network: 10.10.110.0/24
              start: 10.10.110.10
              end: 10.10.110.254
              default_gateway: 10.10.110.1
              lease_days: 1

          # Transit to Inter-VRF Router
          - id: 91
            name: T1_VRF1_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 10.255.91.1/30

        # Route VRF2 subnet through external router
        static_routes:
          - prefix: 10.20.120.0/24
            next_hop: 10.255.91.2
            nodes:
              - DC1-Leaf1

      # ======================================================
      # Tenant1 VRF2
      # ======================================================
      - name: Tenant1_VRF2
        vrf_vni: 50112

        svis:

          # User VLAN
          - id: 120
            name: USERS_T1_VR2_VLAN120
            enabled: true
            ip_address_virtual: 10.20.120.1/24

            # DHCP server pool definition (custom data)
            dhcp_pool:
              network: 10.20.120.0/24
              start: 10.20.120.10
              end: 10.20.120.254
              default_gateway: 10.20.120.1
              lease_days: 1

          # Transit to Inter-VRF Router
          - id: 92
            name: T1_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 10.255.92.1/30

        # Route VRF1 subnet through external router
        static_routes:
          - prefix: 10.10.110.0/24
            next_hop: 10.255.92.2
            nodes:
              - DC1-Leaf1
