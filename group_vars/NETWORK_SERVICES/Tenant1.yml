---
# Tenant1 contains VRF11 and VRF12.
tenant1_services:
  - name: Tenant1
    mac_vrf_vni_base: 10000

    vrfs:
      - name: Tenant1_VRF1
        vrf_vni: 50111

        # Existing VLAN 100 service is retained under Tenant1 / VRF11.
        svis:
          - id: 110
            name: USERS_VLAN110
            enabled: true
            ip_address_virtual: 10.110.110.1/24

      - name: Tenant1_VRF2
        vrf_vni: 50112
        # Add VRF12 SVIs or L3 interfaces here.
        svis:
          - id: 120
            name: USERS_VLAN120
            enabled: true
            ip_address_virtual: 10.120.120.1/24
