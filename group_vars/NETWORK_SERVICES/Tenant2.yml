
---
# ==========================================================
# Tenant2 - Network Services and DHCP
# DHCP serving leaf: DC1-Leaf4
# ==========================================================

tenant2_services:
  - name: Tenant2
    mac_vrf_vni_base: 20000

    vrfs:

      # ======================================================
      # Tenant2 VRF1
      # ======================================================
      - name: Tenant2_VRF1
        vrf_vni: 50221

        svis:

          # User VLAN 210
          - id: 210
            name: T2_VR1_USERS_VLAN210
            enabled: true
            ip_address_virtual: 20.10.210.1/24

            # Enable DHCP only on the designated serving leaf
            structured_config: "{{ {'dhcp_server_ipv4': true} if inventory_hostname == 'DC1-Leaf4' else {} }}"

      # ======================================================
      # Tenant2 VRF2
      # ======================================================
      - name: Tenant2_VRF2
        vrf_vni: 50222

        svis:

          # User VLAN 220
          - id: 220
            name: T2_VR2_USERS_VLAN220
            enabled: true
            ip_address_virtual: 20.20.220.1/24

            # Enable DHCP only on the designated serving leaf
            structured_config: "{{ {'dhcp_server_ipv4': true} if inventory_hostname == 'DC1-Leaf4' else {} }}"


# ==========================================================
# Tenant2 DHCP server definitions
# ==========================================================

tenant2_dhcp_servers:

  # VRF1 - VLAN 210
  - vrf: Tenant2_VRF1
    ipv4_subnets:
      - subnet: 20.10.210.0/24
        default_gateway: 20.10.210.1
        ranges:
          - start: 20.10.210.10
            end: 20.10.210.254

  # VRF2 - VLAN 220
  - vrf: Tenant2_VRF2
    ipv4_subnets:
      - subnet: 20.20.220.0/24
        default_gateway: 20.20.220.1
        ranges:
          - start: 20.20.220.10
            end: 20.20.220.254
