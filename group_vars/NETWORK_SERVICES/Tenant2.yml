---
# Tenant2 contains VRF21 and VRF22.
tenant2_services:
  - name: Tenant2
    mac_vrf_vni_base: 20000

    vrfs:
      - name: Tenant2_VRF1
        vrf_vni: 50221
        # Add VRF21 SVIs or L3 interfaces here.
        
        svis:
          - id: 210
            name: T1_VR1_USERS_VLAN210
            enabled: true
            ip_address_virtual: 10.210.210.1/24

      - name: Tenant2_VRF2
        vrf_vni: 50222
        # Add VRF22 SVIs or L3 interfaces here.
        
        svis:
          - id: 220
            name: T1_VR2_USERS_VLAN220
            enabled: true
            ip_address_virtual: 10.222.222.1/24

          # Dedicated router/firewall transit VLAN for Tenant2_VRF1
          - id: 92
            name: T1_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 10.255.92.1/30
