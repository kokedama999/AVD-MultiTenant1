---
# ======================================================
# Tenant2 - Network Services
# ======================================================

tenant2_services:
  - name: Tenant2
    mac_vrf_vni_base: 20000

    vrfs:

      # ==================================================
      # Tenant2 VRF1
      # ==================================================
      - name: Tenant2_VRF1
        vrf_vni: 50221

        svis:

          # User VLAN
          - id: 210
            name: T2_VR1_USERS_VLAN210
            enabled: true
            ip_address_virtual: 20.10.210.1/24


          # Transit to Inter-VRF Router
          - id: 2201
            name: T2_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 201.201.201.1/30

        static_routes:
          - prefix: 10.10.110.0/24
            next_hop: 201.201.201.2
            nodes:
              - DC1-Leaf1
              
          - prefix: 10.20.120.0/24
            next_hop: 201.201.201.2
            nodes:
              - DC1-Leaf1
              
          - prefix: 20.20.220.0/24
            next_hop: 201.201.201.2
            nodes:
              - DC1-Leaf1

      # ==================================================
      # Tenant2 VRF2
      # ==================================================
      - name: Tenant2_VRF2
        vrf_vni: 50222

        svis:

          # User VLAN
          - id: 220
            name: T2_VR2_USERS_VLAN220
            enabled: true
            ip_address_virtual: 20.20.220.1/24


          # Transit to Inter-VRF Router
          - id: 2202
            name: T2_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 202.202.202.1/30

        static_routes:
          - prefix: 10.10.110.0/24
            next_hop: 202.202.202.2
            nodes:
              - DC1-Leaf1
              
          - prefix: 10.20.120.0/24
            next_hop: 202.202.202.2
            nodes:
              - DC1-Leaf1

          - prefix: 20.10.210.0/24
            next_hop: 202.202.202.2
            nodes:
              - DC1-Leaf1
              

