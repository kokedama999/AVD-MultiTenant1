---
# ======================================================
# Tenant2 - Network Services
# ======================================================

tenant2_services:
  - name: Tenant2
    mac_vrf_vni_base: 20000

    vrfs:

      # ==================================================
      # Tenant2 VRF1
      # ==================================================
      - name: Tenant2_VRF1
        vrf_vni: 50221

        svis:

          # User VLAN
          - id: 210
            name: T2_VR1_USERS_VLAN210
            enabled: true
            ip_address_virtual: 20.10.210.1/24






          # Transit to Inter-VRF Router
          - id: 2201
            name: T2_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 201.201.201.1/30

        static_routes:
          - prefix: 10.10.110.0/24
            next_hop: 201.201.201.1
            nodes:
              - DC1-Leaf1
              
          - prefix: 10.20.120.0/24
            next_hop: 201.201.201.1
            nodes:
              - DC1-Leaf1

          - prefix: 20.10.210.0/24
            next_hop: 201.201.201.1
            nodes:
              - DC1-Leaf1
              
          - prefix: 20.20.220.0/24
            next_hop: 201.201.201.1
            nodes:
              - DC1-Leaf1

      # ==================================================
      # Tenant2 VRF2
      # ==================================================
      - name: Tenant2_VRF2
        vrf_vni: 50222

        svis:

          # User VLAN
          - id: 220
            name: T2_VR2_USERS_VLAN220
            enabled: true
            ip_address_virtual: 20.20.220.1/24


          # Transit to Inter-VRF Router
          - id: 2201
            name: T2_VRF2_ROUTER_TRANSIT
            enabled: true
            nodes:
              - node: DC1-Leaf1
                ip_address: 202.202.202.1/30

        static_routes:
          - prefix: 10.10.110.0/24
            next_hop: 202.202.202.1
            nodes:
              - DC1-Leaf1
              
          - prefix: 10.20.120.0/24
            next_hop: 202.202.202.1
            nodes:
              - DC1-Leaf1

          - prefix: 20.10.210.0/24
            next_hop: 202.202.202.1
            nodes:
              - DC1-Leaf1
              
          - prefix: 20.20.220.0/24
            next_hop: 202.202.202.1
            nodes:
              - DC1-Leaf1



# ======================================================
# Tenant2 DHCP Pools
# ======================================================

tenant2_dhcp_server_definitions:

  - vrf: Tenant2_VRF1
    lease_time_ipv4:
      days: 1
      hours: 0
      minutes: 0
    ipv4_subnets:
      - subnet: 20.10.210.0/24
        default_gateway: 20.10.210.1
        ranges:
          - start: 20.10.210.10
            end: 20.10.210.254

  - vrf: Tenant2_VRF2
    lease_time_ipv4:
      days: 1
      hours: 0
      minutes: 0
    ipv4_subnets:
      - subnet: 20.20.220.0/24
        default_gateway: 20.20.220.1
        ranges:
          - start: 20.20.220.10
            end: 20.20.220.254






# ======================================================
# Enable DHCP on Tenant2 SVIs
# ======================================================

tenant2_dhcp_svi_definitions:
  - name: Vlan210
    dhcp_server_ipv4: true

  - name: Vlan220
    dhcp_server_ipv4: true


# ======================================================
# Apply Tenant2 DHCP only to DC1-Leaf4
# ======================================================

tenant2_csc_dhcp_servers: "{{ tenant2_dhcp_server_definitions if inventory_hostname == 'DC1-Leaf4' else [] }}"

tenant2_csc_vlan_interfaces: "{{ tenant2_dhcp_svi_definitions if inventory_hostname == 'DC1-Leaf4' else [] }}"
