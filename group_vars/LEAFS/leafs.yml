---
type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-lab

    # Loopback0 - Router ID / EVPN peering
    loopback_ipv4_pool: 51.0.0.0/24

    # Loopback1 - VXLAN VTEP
    vtep_loopback_ipv4_pool: 172.16.0.0/24

    # Both leaves connect to both spines
    uplink_switches:
      - DC1-Spine1
      - DC1-Spine2

    uplink_ipv4_pool: 192.168.250.0/24

    # ---------------------------------------------------------
    # MLAG
    # Ethernet3 and Ethernet4 are the physical peer-link members
    # ---------------------------------------------------------
    mlag_interfaces:
      - Ethernet3
      - Ethernet4

    # VLAN4094 - MLAG control-plane
    mlag_peer_ipv4_pool: 192.169.169.0/25

    # VLAN4093 - MLAG L3 / iBGP peering
    mlag_peer_l3_ipv4_pool: 192.169.169.128/25

    virtual_router_mac_address: 00:1c:73:00:00:99

    spanning_tree_mode: mstp
    spanning_tree_priority: 4096

  node_groups:

    # =========================================================
    # MLAG PAIR 1
    # DC1-Leaf1 <-> DC1-Leaf2
    # =========================================================
    - group: DC1_LEAF_PAIR1

      # Both MLAG peers use the same ASN
      bgp_as: "63524.11"

      nodes:

        - name: DC1-Leaf1
          id: 11
          mgmt_ip: 192.168.99.11/24

          uplink_interfaces:
            - Ethernet1
            - Ethernet2

          uplink_switch_interfaces:
            - Ethernet1
            - Ethernet1

        - name: DC1-Leaf2
          id: 12
          mgmt_ip: 192.168.99.12/24

          uplink_interfaces:
            - Ethernet1
            - Ethernet2

          uplink_switch_interfaces:
            - Ethernet2
            - Ethernet2


    # =========================================================
    # MLAG PAIR 2
    # DC1-Leaf3 <-> DC1-Leaf4
    # =========================================================
    - group: DC1_LEAF_PAIR2

      # Both MLAG peers use the same ASN
      bgp_as: "63524.13"

      nodes:

        - name: DC1-Leaf3
          id: 13
          mgmt_ip: 192.168.99.13/24

          uplink_interfaces:
            - Ethernet1
            - Ethernet2

          uplink_switch_interfaces:
            - Ethernet3
            - Ethernet3

        - name: DC1-Leaf4
          id: 14
          mgmt_ip: 192.168.99.14/24

          uplink_interfaces:
            - Ethernet1
            - Ethernet2

          uplink_switch_interfaces:
            - Ethernet4
            - Ethernet4
