! Command: show running-config
! device: DC1-Leaf2 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$AVDLabSalt123456$0K2IRj5g7EyYoC9Tgmt3p6q/6X/c12OzqR2APekIY0ZTDXXUq2SMsS6kiizulKBZ0TbWnFm7TpWxGGVO/QTqx1
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DC1-Leaf2
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
vlan 100
   name USERS_VLAN100
!
vrf instance MGMT
!
vrf instance VRF11
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_DC1-Spine1_Ethernet2
   no switchport
   ip address 192.168.250.45/31
!
interface Ethernet2
   description P2P_DC1-Spine2_Ethernet2
   no switchport
   ip address 192.168.250.47/31
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   description ROUTER_ID
   ip address 51.0.0.12/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   ip address 172.16.0.12/32
!
interface Management1
   description OOB_MANAGEMENT
   vrf MGMT
   ip address 192.168.99.12/24
!
interface Vlan100
   description USERS_VLAN100
   vrf VRF11
   ip address virtual 10.100.100.1/24
!
interface Vxlan1
   description DC1-Leaf2_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vrf VRF11 vni 50111
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF11
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 51.0.0.0/24 eq 32
   seq 20 permit 172.16.0.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 63524.12
   bgp asn notation asdot
   router-id 51.0.0.12
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 51.0.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 51.0.0.1 remote-as 64524.0
   neighbor 51.0.0.1 description DC1-Spine1_Loopback0
   neighbor 51.0.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 51.0.0.2 remote-as 64524.0
   neighbor 51.0.0.2 description DC1-Spine2_Loopback0
   neighbor 192.168.250.44 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.250.44 remote-as 64524.0
   neighbor 192.168.250.44 description DC1-Spine1_Ethernet2
   neighbor 192.168.250.46 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.250.46 remote-as 64524.0
   neighbor 192.168.250.46 description DC1-Spine2_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 51.0.0.12:10100
      route-target both 10100:10100
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf VRF11
      rd 51.0.0.12:50111
      route-target import evpn 50111:50111
      route-target export evpn 50111:50111
      router-id 51.0.0.12
      redistribute connected
!
end