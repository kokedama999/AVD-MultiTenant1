! Command: show running-config
! device: DC1-Spine2 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$AVDLabSalt123456$0K2IRj5g7EyYoC9Tgmt3p6q/6X/c12OzqR2APekIY0ZTDXXUq2SMsS6kiizulKBZ0TbWnFm7TpWxGGVO/QTqx1
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DC1-Spine2
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_DC1-Leaf1_Ethernet2
   no switchport
   ip address 192.168.250.42/31
!
interface Ethernet2
   description P2P_DC1-Leaf2_Ethernet2
   no switchport
   ip address 192.168.250.46/31
!
interface Ethernet3
   description P2P_DC1-Leaf3_Ethernet2
   no switchport
   ip address 192.168.250.50/31
!
interface Ethernet4
   description P2P_DC1-Leaf4_Ethernet2
   no switchport
   ip address 192.168.250.54/31
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   description ROUTER_ID
   ip address 51.0.0.2/32
!
interface Management1
   description OOB_MANAGEMENT
   vrf MGMT
   ip address 192.168.99.200/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 51.0.0.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 64524.0
   bgp asn notation asdot
   router-id 51.0.0.2
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 51.0.0.11 peer group EVPN-OVERLAY-PEERS
   neighbor 51.0.0.11 remote-as 63524.11
   neighbor 51.0.0.11 description DC1-Leaf1_Loopback0
   neighbor 51.0.0.12 peer group EVPN-OVERLAY-PEERS
   neighbor 51.0.0.12 remote-as 63524.12
   neighbor 51.0.0.12 description DC1-Leaf2_Loopback0
   neighbor 51.0.0.13 peer group EVPN-OVERLAY-PEERS
   neighbor 51.0.0.13 remote-as 63524.13
   neighbor 51.0.0.13 description DC1-Leaf3_Loopback0
   neighbor 51.0.0.14 peer group EVPN-OVERLAY-PEERS
   neighbor 51.0.0.14 remote-as 63524.14
   neighbor 51.0.0.14 description DC1-Leaf4_Loopback0
   neighbor 192.168.250.43 peer group IPv4-UNDERLAY-PEERS
