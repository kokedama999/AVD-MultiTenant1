   neighbor 192.168.250.47 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.250.47 remote-as 63524.12
   neighbor 192.168.250.47 description DC1-Leaf2_Ethernet2
   neighbor 192.168.250.51 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.250.51 remote-as 63524.13
   neighbor 192.168.250.51 description DC1-Leaf3_Ethernet2
   neighbor 192.168.250.55 peer group IPv4-UNDERLAY-PEERS
   neighbor 192.168.250.55 remote-as 63524.14
   neighbor 192.168.250.55 description DC1-Leaf4_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
